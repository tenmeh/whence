<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 116" width="100" height="116">
  <!--
    The hex of the logo without the wordmark, for the navigation bar, where
    it is drawn at about 30 pixels high. It is still, on purpose. The bar is
    on every page, and a picture that moves there would take the eye from
    the text. The paths and the colours are those of whence-hex.svg in
    pkgdown/logo/. The bars are centred in the hex, and the border is one
    unit thicker, so that it holds at this size. The dotted underline is a
    solid line here, because dots of 1 pixel blur into a grey smear.
  -->
  <path d="M50 2 L98 30 L98 86 L50 114 L2 86 L2 30 Z" fill="#F4EFE4" stroke="#17202A" stroke-width="4" stroke-linejoin="round"/>
  <g transform="translate(50 58) scale(1.2) translate(-50 -54.5)">
    <g fill="#D9D0BE">
      <rect x="38.75" y="32" width="9" height="12" rx="1.5"/>
      <rect x="52.25" y="44" width="9" height="10" rx="1.5"/>
      <rect x="65.75" y="54" width="9" height="7" rx="1.5"/>
    </g>
    <g fill="#17202A">
      <rect x="25.25" y="32" width="9" height="38" rx="1.5"/>
      <rect x="38.75" y="44" width="9" height="26" rx="1.5"/>
      <rect x="52.25" y="54" width="9" height="16" rx="1.5"/>
    </g>
    <rect x="65.75" y="61" width="9" height="9" rx="1.5" fill="#7356D6"/>
    <rect x="25.25" y="75" width="49.5" height="2.4" rx="1.2" fill="#7356D6"/>
  </g>
</svg>
