# Build the documentation site and publish it to GitHub Pages.
#
# A pull request builds the site, but does not publish it. A bad reference
# index or an example that fails is thus found before the site goes live.
#
# There is no trigger on a tag here, and that is intentional. The template
# from r-lib has one, because it sends the site to a gh-pages branch, and a
# branch has no environment rules. This workflow uses the newer method:
# actions/deploy-pages, with the github-pages environment. That environment
# permits the default branch only, so a push of a tag gives:
#
#   Tag "v0.2.1" is not allowed to deploy to github-pages due to
#   environment protection rules.
#
# A tag always points at a commit that main has already built and
# published, so a build on a tag adds nothing and fails every time.
#
# The upload and the deploy run only when the repository is public. GitHub
# Pages is not available for a private repository on a free plan, so a
# deploy from a private repository fails each time. Until the repository is
# public, this workflow still builds the site, and a pull request thus still
# finds a bad reference index or a broken article.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # shinylive builds the live demo.
          extra-packages: any::pkgdown, any::shinylive, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # The live demo: the demo app, exported with shinylive into docs/demo.
      # articles/live-demo.html shows it in an iframe. See the script for
      # how whence gets into webR.
      - name: Build live demo
        run: Rscript pkgdown/live-demo.R docs

      - name: Upload artifact
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request' && !github.event.repository.private
    needs: pkgdown
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
