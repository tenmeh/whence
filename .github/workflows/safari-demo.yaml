# A throwaway test of the live demo in real Safari (#15). This file lives
# only on the branch test/safari-demo, which is never merged.
#
# The demo of this branch and a baseline app with no whence are built with
# shinylive on the runner, served on localhost, and opened in Safari. The
# demo names each output in the console as it starts, so the last name shows
# which output runs out of stack.
on:
  push:
    branches: [test/safari-demo]

name: safari-demo

permissions: read-all

jobs:
  safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: |
          sw_vers
          defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::shinylive
            any::dplyr
            any::ggplot2
            any::reactable

      - name: Build the demo and the baseline
        run: |
          mkdir site
          Rscript pkgdown/live-demo.R site
          Rscript -e 'shinylive::export(".github/safari/baseline", "site/baseline", quiet = TRUE)'

      - name: Enable safaridriver
        run: sudo safaridriver --enable

      - name: Install selenium
        run: python3 -m pip install --break-system-packages selenium

      - name: Open the baseline in Safari
        run: |
          python3 -m http.server 8000 --directory site > /dev/null 2>&1 &
          sleep 2
          python3 .github/safari/safari-demo.py http://localhost:8000/baseline/ 240 baseline

      - name: Open the demo in Safari
        run: python3 .github/safari/safari-demo.py http://localhost:8000/demo/ 240 demo

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-macos
          path: safari-*.png
